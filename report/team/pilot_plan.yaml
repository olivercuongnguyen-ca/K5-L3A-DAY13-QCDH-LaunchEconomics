# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số tính bằng src/lab13.py (hàm chay_nhiem_vu_d). Mọi số từ cột _simulated hoặc giả định của lab ghi nhãn simulated.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.250 yêu cầu mỗi nhóm (statsmodels NormalIndPower; đáp án 1.251)
#   b) Theo nhân viên, m = 75: hệ số thiết kế 1 + 74 x 0,02 = 2,48; 1.250 x 2,48 = 3.099 mỗi nhóm
#      = 41 nhân viên mỗi nhóm, tổng 83 người > 40 nhân viên của LogiX-VN: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.250: không đạt con số ở câu a
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m - 1) x 0,02) >= 859
#      suy ra m >= 299 yêu cầu mỗi nhân viên (hệ số thiết kế 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có. 20 nhân viên đối chứng làm cùng các tuần rollout, cùng 12 depot, cùng loại yêu cầu.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên. Bốc thăm bằng code với seed ghi trước ngày bắt đầu, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot chép câu trả lời của nhau. Giảm bằng quyền truy cập trợ lý theo tài khoản và log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có. Chốt trong file này trước ngày bắt đầu; không đổi sau khi có số.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên 20 + 20 không đạt 859 hay 1.250 mẫu hiệu dụng nếu mỗi người xử lý ít hơn 299 yêu cầu,
#   nên nhóm chấp nhận chỉ thấy mức chênh 6 điểm thay vì 5 điểm. Nếu tác động thật chỉ là 5 điểm,
#   power còn khoảng 0,64 (n = 859), tức hơn một phần ba khả năng bỏ sót tác động thật.
#   Chia theo depot bị loại: tối đa 6 cụm mỗi nhóm, dưới 20 cụm và cỡ mẫu hiệu dụng chỉ 300.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); riêng noi_dia + hang_nang 3,97% (39/982). Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu
#   vì thấp hơn mức hiện tại. Chọn: dừng khi nhóm trợ lý cao hơn đối chứng từ 2 điểm, hoặc vượt trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"   # người có quyền dừng và mở rộng pilot
  scope: "Chỉ noi_dia và hang_nang (chi phí mỗi việc thành công 0,22 lần và 0,69 lần so với 12.000 đ, simulated); loại quoc_te (1,88 lần, simulated) và doi_tac (0,85 lần, simulated) chuyển nhân viên, không vào pilot"
  assignment:
    unit: "staff"                     # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]         # mỗi bước một tuần; tương ứng 4, 10, 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                         # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, cùng loại yêu cầu"
    spillover_risk: "Có: chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu pilot"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ về nhân viên KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công cao hơn 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ Quản lý sản phẩm trợ lý thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý của trợ lý cao hơn 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày làm việc KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-05"          # sau 3 tuần rollout từ 2026-12-07 cộng 7 ngày theo dõi mở lại và thời gian phân tích
  simulated_inputs:
    - "Phút xem lại và phút làm lại (cột phut_xem_lai_simulated, phut_lam_lai_simulated)"
    - "Chi phí mỗi việc thành công 8.000 đ cho luật dừng chi phí, 4.472 đ hiện tại, và các tỉ lệ so với 12.000 đ (tính từ hai cột trên)"
    - "Giả định lab: baseline 0,70; ICC 0,02; 40 nhân viên; 12 depot; lương 2.000 đ mỗi phút; chi phí cố định 40 triệu đ mỗi tháng"
